# Order 9 successor curriculum.
#
# C0--C2 are preserved below with the same stage contents used by the historical
# v2 schedule.  Their accepted artifacts remain v2 artifacts and enter this
# schedule only through configs/training/order9_curriculum_lineage_v3.yaml.
#
# C3 execution is now prepared but is not started by loading this configuration.
# Its production tensor pi_L path consumes the complete active-knot contract,
# the v2 -> v3 lineage import is fail-closed, and its 1024-environment runtime
# is bound to the measured two-process C3 capacity report below.
curriculum:
  schedule_version: order9_curriculum_v3_progressive_object_conditions
  contact_wrench_contract_version: contact_frame_robot_on_target_v2
  pi_h_is_learned_proposal_only: true
  deterministic_checker_projects_actions: false
  dynamic_assembly_policy_learned: false
  stages:
    # Preserved v2 prefix ---------------------------------------------------
    - stage_id: c0_order8_teacher_collection
      stage_index: 0
      learning_mode: collection
      learning_target: dataset
      min_modules: 3
      max_modules: 3
      topology_randomized: false
      object_distribution: conservative_order8_anchor
      deterministic_teacher_required: true
      pi_h_output_scope: full_contact_wrench_trajectory
      phase_conditioned_actor_required: true
      design_action_mask_required: false
      assembly_evaluation_mode: separate
      end_to_end_episode_fraction: 0.0
      environment_steps: 0
      minimum_episodes: 20
      minimum_success_rate: 0.95
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0
      maximum_safety_failure_episodes: 0
      held_out_only: false
      task_adapter_ids: [object_grasp_carry_v1]

    - stage_id: c1_pi_l_bc_fixed_nominal
      stage_index: 1
      learning_mode: behavior_cloning
      learning_target: pi_l
      min_modules: 3
      max_modules: 3
      topology_randomized: false
      object_distribution: conservative_order8_anchor
      deterministic_teacher_required: true
      pi_h_output_scope: not_applicable
      phase_conditioned_actor_required: true
      design_action_mask_required: false
      assembly_evaluation_mode: separate
      end_to_end_episode_fraction: 0.0
      environment_steps: 0
      minimum_episodes: 100
      minimum_success_rate: 0.90
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0
      maximum_safety_failure_episodes: 0
      held_out_only: false
      task_adapter_ids: [object_grasp_carry_v1]

    - stage_id: c2_pi_l_ppo_fixed_conservative
      stage_index: 2
      learning_mode: ppo
      learning_target: pi_l
      min_modules: 3
      max_modules: 3
      topology_randomized: false
      object_distribution: conservative_order8_anchor
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      phase_conditioned_actor_required: true
      design_action_mask_required: false
      assembly_evaluation_mode: separate
      end_to_end_episode_fraction: 0.0
      environment_steps: 3000000
      parallel_environment_count: 2048
      rollout_steps_per_environment: 16
      minimum_episodes: 200
      minimum_success_rate: 0.85
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0
      maximum_safety_failure_episodes: 0
      held_out_only: false
      task_adapter_ids: [object_grasp_carry_v1]

    # C3 remains morphology-only: no expanded object claim is made here.
    - stage_id: c3_pi_l_ppo_arbitrary_morphology
      stage_index: 3
      learning_mode: ppo
      learning_target: pi_l
      min_modules: 2
      max_modules: 8
      topology_randomized: true
      object_distribution: conservative_order8_anchor
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      phase_conditioned_actor_required: true
      design_action_mask_required: false
      assembly_evaluation_mode: separate
      end_to_end_episode_fraction: 0.0
      environment_steps: 7000000
      minimum_episodes: 400
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0
      maximum_safety_failure_episodes: 0
      held_out_only: false
      task_adapter_ids: [object_grasp_carry_v1]

    # R1: canonical box/property family, expanded reachable position and yaw.
    - &r1_teacher
      stage_id: r1_teacher_trajectory_collection
      stage_index: 4
      learning_mode: collection
      learning_target: dataset
      min_modules: 2
      max_modules: 8
      topology_randomized: true
      object_distribution: reachable_pose_expansion
      deterministic_teacher_required: true
      pi_h_output_scope: full_contact_wrench_trajectory
      phase_conditioned_actor_required: true
      design_action_mask_required: false
      assembly_evaluation_mode: separate
      end_to_end_episode_fraction: 0.0
      environment_steps: 0
      minimum_episodes: 100
      minimum_success_rate: 0.95
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0
      maximum_safety_failure_episodes: 0
      held_out_only: false
      task_adapter_ids: [object_grasp_carry_v1]

    - <<: *r1_teacher
      stage_id: r1_pi_l_bc_teacher_trajectory
      stage_index: 5
      learning_mode: behavior_cloning
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      minimum_episodes: 200
      minimum_success_rate: 0.85

    - <<: *r1_teacher
      stage_id: r1_pi_l_ppo_teacher_trajectory
      stage_index: 6
      learning_mode: ppo
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      environment_steps: 3000000
      minimum_episodes: 400
      minimum_success_rate: 0.80

    - <<: *r1_teacher
      stage_id: r1_pi_h_assignment_bc
      stage_index: 7
      learning_mode: behavior_cloning
      learning_target: pi_h_assignment
      pi_h_output_scope: assignment_only_warmup
      minimum_episodes: 200
      minimum_success_rate: 0.85

    - <<: *r1_teacher
      stage_id: r1_pi_h_full_trajectory_bc
      stage_index: 8
      learning_mode: behavior_cloning
      learning_target: pi_h_trajectory
      minimum_episodes: 300
      minimum_success_rate: 0.85
      minimum_no_fallback_success_rate: 0.70
      maximum_fallback_rate: 0.20

    # pi_L is frozen while learned pi_H is optimized through production C_H.
    - <<: *r1_teacher
      stage_id: r1_pi_h_ppo_frozen_pi_l
      stage_index: 9
      learning_mode: ppo
      learning_target: pi_h_trajectory
      deterministic_teacher_required: false
      environment_steps: 5000000
      minimum_episodes: 500
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # pi_H is frozen; promotion is evaluated cumulatively over R0 and R1.
    - <<: *r1_teacher
      stage_id: r1_pi_l_readaptation_frozen_pi_h
      stage_index: 10
      learning_mode: ppo
      learning_target: pi_l
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      environment_steps: 2000000
      minimum_episodes: 500
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # R2: boxes with size/aspect/density/mass/CoM/inertia diversity.
    - &r2_teacher
      <<: *r1_teacher
      stage_id: r2_teacher_trajectory_collection
      stage_index: 11
      object_distribution: box_property_expansion
      minimum_episodes: 150

    - <<: *r2_teacher
      stage_id: r2_pi_l_bc_teacher_trajectory
      stage_index: 12
      learning_mode: behavior_cloning
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      minimum_episodes: 300
      minimum_success_rate: 0.85

    - <<: *r2_teacher
      stage_id: r2_pi_l_ppo_teacher_trajectory
      stage_index: 13
      learning_mode: ppo
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      environment_steps: 3000000
      minimum_episodes: 400
      minimum_success_rate: 0.80

    - <<: *r2_teacher
      stage_id: r2_pi_h_assignment_bc
      stage_index: 14
      learning_mode: behavior_cloning
      learning_target: pi_h_assignment
      pi_h_output_scope: assignment_only_warmup
      minimum_episodes: 300
      minimum_success_rate: 0.85

    - <<: *r2_teacher
      stage_id: r2_pi_h_full_trajectory_bc
      stage_index: 15
      learning_mode: behavior_cloning
      learning_target: pi_h_trajectory
      minimum_episodes: 400
      minimum_success_rate: 0.85
      minimum_no_fallback_success_rate: 0.70
      maximum_fallback_rate: 0.20

    - <<: *r2_teacher
      stage_id: r2_pi_h_ppo_frozen_pi_l
      stage_index: 16
      learning_mode: ppo
      learning_target: pi_h_trajectory
      deterministic_teacher_required: false
      environment_steps: 5000000
      minimum_episodes: 500
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # Cumulative gate: R0--R2 must all retain their independent thresholds.
    - <<: *r2_teacher
      stage_id: r2_pi_l_readaptation_frozen_pi_h
      stage_index: 17
      learning_mode: ppo
      learning_target: pi_l
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      environment_steps: 2000000
      minimum_episodes: 500
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # R3: box/sphere/cylinder training primitives.
    - &r3_teacher
      <<: *r1_teacher
      stage_id: r3_teacher_trajectory_collection
      stage_index: 18
      object_distribution: expanded_primitives
      minimum_episodes: 250

    - <<: *r3_teacher
      stage_id: r3_pi_l_bc_teacher_trajectory
      stage_index: 19
      learning_mode: behavior_cloning
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      minimum_episodes: 400
      minimum_success_rate: 0.85

    - <<: *r3_teacher
      stage_id: r3_pi_l_ppo_teacher_trajectory
      stage_index: 20
      learning_mode: ppo
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      environment_steps: 3000000
      minimum_episodes: 500
      minimum_success_rate: 0.80

    - <<: *r3_teacher
      stage_id: r3_pi_h_assignment_bc
      stage_index: 21
      learning_mode: behavior_cloning
      learning_target: pi_h_assignment
      pi_h_output_scope: assignment_only_warmup
      minimum_episodes: 400
      minimum_success_rate: 0.85

    - <<: *r3_teacher
      stage_id: r3_pi_h_full_trajectory_bc
      stage_index: 22
      learning_mode: behavior_cloning
      learning_target: pi_h_trajectory
      minimum_episodes: 600
      minimum_success_rate: 0.85
      minimum_no_fallback_success_rate: 0.70
      maximum_fallback_rate: 0.20

    - <<: *r3_teacher
      stage_id: r3_pi_h_ppo_frozen_pi_l
      stage_index: 23
      learning_mode: ppo
      learning_target: pi_h_trajectory
      deterministic_teacher_required: false
      environment_steps: 5000000
      minimum_episodes: 600
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # Cumulative gate: R0--R3 remain separately visible and passing.
    - <<: *r3_teacher
      stage_id: r3_pi_l_readaptation_frozen_pi_h
      stage_index: 24
      learning_mode: ppo
      learning_target: pi_l
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      environment_steps: 2000000
      minimum_episodes: 600
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # R4: full train cross-product of morphology and object conditions.
    - &r4_teacher
      <<: *r1_teacher
      stage_id: r4_teacher_trajectory_collection
      stage_index: 25
      object_distribution: expanded_cross_product
      minimum_episodes: 400

    - <<: *r4_teacher
      stage_id: r4_pi_l_bc_teacher_trajectory
      stage_index: 26
      learning_mode: behavior_cloning
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      minimum_episodes: 500
      minimum_success_rate: 0.85

    - <<: *r4_teacher
      stage_id: r4_pi_l_ppo_teacher_trajectory
      stage_index: 27
      learning_mode: ppo
      learning_target: pi_l
      pi_h_output_scope: not_applicable
      environment_steps: 3000000
      minimum_episodes: 800
      minimum_success_rate: 0.80

    - <<: *r4_teacher
      stage_id: r4_pi_h_assignment_bc
      stage_index: 28
      learning_mode: behavior_cloning
      learning_target: pi_h_assignment
      pi_h_output_scope: assignment_only_warmup
      minimum_episodes: 500
      minimum_success_rate: 0.85

    - <<: *r4_teacher
      stage_id: r4_pi_h_full_trajectory_bc
      stage_index: 29
      learning_mode: behavior_cloning
      learning_target: pi_h_trajectory
      minimum_episodes: 800
      minimum_success_rate: 0.85
      minimum_no_fallback_success_rate: 0.70
      maximum_fallback_rate: 0.20

    - <<: *r4_teacher
      stage_id: r4_pi_h_ppo_frozen_pi_l
      stage_index: 30
      learning_mode: ppo
      learning_target: pi_h_trajectory
      deterministic_teacher_required: false
      environment_steps: 5000000
      minimum_episodes: 800
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # Final pi_L/pi_H cumulative gate over R0--R4.
    - <<: *r4_teacher
      stage_id: r4_pi_l_readaptation_frozen_pi_h
      stage_index: 31
      learning_mode: ppo
      learning_target: pi_l
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      environment_steps: 2000000
      minimum_episodes: 800
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.75
      maximum_fallback_rate: 0.10

    # pi_D starts only after the broad R4 pi_L/pi_H stack is promoted.
    - <<: *r4_teacher
      stage_id: post_r4_pi_d_structured_bc
      stage_index: 32
      learning_mode: behavior_cloning
      learning_target: pi_d
      pi_h_output_scope: not_applicable
      design_action_mask_required: true
      environment_steps: 0
      minimum_episodes: 500
      minimum_success_rate: 0.80
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0

    - <<: *r4_teacher
      stage_id: post_r4_pi_d_masked_ppo
      stage_index: 33
      learning_mode: ppo
      learning_target: pi_d
      deterministic_teacher_required: false
      pi_h_output_scope: not_applicable
      phase_conditioned_actor_required: false
      design_action_mask_required: true
      environment_steps: 5000000
      minimum_episodes: 500
      minimum_success_rate: 0.75
      minimum_no_fallback_success_rate: 0.0
      maximum_fallback_rate: 1.0

    - <<: *r4_teacher
      stage_id: joint_object_task_ppo
      stage_index: 34
      learning_mode: ppo
      learning_target: joint_object_task
      deterministic_teacher_required: false
      pi_h_output_scope: full_contact_wrench_trajectory
      design_action_mask_required: true
      assembly_evaluation_mode: subset_end_to_end
      end_to_end_episode_fraction: 0.10
      environment_steps: 15000000
      minimum_episodes: 1000
      minimum_success_rate: 0.75
      minimum_no_fallback_success_rate: 0.70
      maximum_fallback_rate: 0.05

    - <<: *r4_teacher
      stage_id: held_out_full_system_evaluation
      stage_index: 35
      learning_mode: evaluation
      learning_target: full_system
      object_distribution: held_out_shapes_and_inertia
      deterministic_teacher_required: false
      pi_h_output_scope: full_contact_wrench_trajectory
      design_action_mask_required: true
      assembly_evaluation_mode: subset_end_to_end
      end_to_end_episode_fraction: 0.10
      environment_steps: 0
      minimum_episodes: 1000
      minimum_success_rate: 0.70
      minimum_no_fallback_success_rate: 0.65
      maximum_fallback_rate: 0.05
      held_out_only: true

reward:
  # The documented 0.5 N value remains a separate contact-existence gate.
  # Exact per-contact 6D wrench-box membership is retained as pi_H feasibility
  # information and rollout telemetry, but is neither a C3 success gate nor a
  # pi_L learning objective.  Contact/task outcome and unchanged safety terms
  # therefore provide all actor reward credit.
  w_wrench_range: 0.0
  # Deployable dense shaping: FK grasp-frame gap, separating motion, and the
  # motor-current-equivalent load proxy are compared with the actuator-aware
  # nominal load.  Raw PhysX contact force is not an actor/reward input here.
  w_normal_contact_quality: 1.0

runtime_benchmark:
  environment_count_candidates: [512, 1024]
  initial_environment_count: 1024
  control_dt_s: 0.02
  minimum_aggregate_env_steps_per_s: 500.0
  warmup_steps: 0
  measurement_steps: 64
  maximum_wall_time_s: 900.0
  topology_bucketed: true
  phase_specific_resets: true
  per_step_json_logging: false
  require_tensorized_pi_l_inference: true

teacher_collection:
  profile_version: order9_c0_bounded_diversity_v1
  episode_count: 20
  validation_episode_count: 3
  held_out_episode_count: 3
  low_level_stride: 5
  high_level_stride: 5
  parallel_process_count: 2
  condition_distribution: conservative_order8_anchor

optimization:
  pi_l_bc:
    epochs: 24
    batch_size: 128
    learning_rate: 0.0003
    value_loss_weight: 0.0
    max_grad_norm: 0.5
    sequence_length: 16
    burn_in_steps: 4
    phase_balanced_sampling: true
  pi_h_assignment_bc:
    epochs: 30
    batch_size: 32
    learning_rate: 0.0003
    value_loss_weight: 0.5
    max_grad_norm: 0.5
    sequence_length: 1
    burn_in_steps: 0
  pi_h_full_bc:
    epochs: 40
    batch_size: 32
    learning_rate: 0.0003
    value_loss_weight: 0.5
    max_grad_norm: 0.5
    sequence_length: 1
    burn_in_steps: 0
  pi_d_bc:
    epochs: 40
    batch_size: 16
    learning_rate: 0.0003
    value_loss_weight: 0.5
    max_grad_norm: 0.5
    sequence_length: 1
    burn_in_steps: 0
  pi_l_ppo:
    rollout_steps_per_environment: 256
    epochs_per_update: 4
    minibatch_size: 4096
    learning_rate: 0.00001
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.20
    value_loss_weight: 0.5
    entropy_bonus_weight: 0.001
    max_grad_norm: 0.5
    target_kl: 0.02
    phase_balanced_sampling: true
    phase_normalized_advantages: true
    phase_local_kl: true
  c3_boundary_fine_tune:
    enabled: true
    target_actor_phase_labels: [establish_contact, lift, transport, place]
    epochs_per_update: 1
    learning_rate_scale: 0.25
    # Same-rollout A/B and the first scale-4 formal update showed that 0.005
    # rolls back after only four optimizer steps.  0.01 completed the same
    # generation while remaining well below the 0.04 topology-phase cap.
    non_target_parent_kl_limit: 0.01
    non_target_parent_kl_weight: 1.0
    maximum_topology_phase_kl: 0.04
    # Exact PhysX wrench remains privileged telemetry only.  Disable the old
    # auxiliary wrench teacher as well as the scalar reward so no hidden
    # wrench-range learning signal survives the outcome-only contract.
    privileged_compression_teacher_weight: 0.0
    privileged_compression_teacher_action_step: 0.10
    # Decompression remains controlled by the ordinary wrench-range reward.
    # A direct privileged target is used only where weak contact otherwise
    # gives the actor almost no useful action-gradient signal.
    privileged_compression_teacher_underforce_only: true
    # Preserve the parent behavior on target-phase samples whose privileged
    # wrench is already inside the authored range.  This prevents gradients
    # from other morphologies from needlessly moving a solved morphology.
    privileged_wrench_satisfied_parent_kl_weight: 0.0
    # Multi-task PCGrad across the 2--8 module topology losses.  This is a
    # diagnostic mitigation for destructive shared-policy gradient conflict.
    topology_gradient_surgery_enabled: false
    # The six-module diagnostic showed that the learned normal action used
    # only 0.21 mm of a 10 mm bound and that no on-policy sample exceeded
    # 3 mm.  A fresh provenance-bound initializer widens only this stochastic
    # coordinate to sigma=0.30.  Deterministic inference, actor mean, action
    # bounds, reward, QPID, and every morphology's action semantics are
    # unchanged.
    contact_normal_exploration_initial_std: 0.30
    # The contact-space actor keeps every deployed action path live.  Dense
    # reward terms are routed to contact, centroidal, and posture action
    # densities separately, while terminal task outcome is shared equally and
    # the critic continues to fit the unchanged scalar return.
    compression_only_actor_objective: false
    joint_head_only_actor_update: false
    contact_residual_only_actor_update: false
    factorized_actor_credit_enabled: true
    # No extra optimizer pass is used.  In the ordinary PPO pass, contact
    # reward is split across normal/tangential/rotational action likelihoods.
    contact_head_extra_optimizer_passes: 0
    contact_coordinate_credit_enabled: true
    # Increase only the inward-normal PPO objective.  Scalar reward values,
    # the critic target, deployed action bounds, and other actor heads remain
    # unchanged.  This raises the normal coordinate's effective contribution
    # from 1/9 to 1/3 of the full factorized actor objective.
    contact_normal_translation_actor_loss_weight: 3.0
    # The training-only under-preload randomization is known exactly.  Teach
    # its corresponding 0.5 mm categorical residual directly, while keeping
    # the deficit out of deployed observations and commands.
    contact_normal_preload_deficit_teacher_weight: 0.1
    # Physical inward-normal quantization is implemented as a diagnostic.
    # The 0.5 mm seven-module trial left the deployed command in the same
    # 12.0 mm bin and did not solve bucket 40, so the accepted continuation
    # contract retains the continuous mapping.
    contact_normal_action_quantization_step_m: null
  pi_h_ppo:
    rollout_steps_per_environment: 64
    epochs_per_update: 4
    minibatch_size: 512
    learning_rate: 0.0001
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.20
    value_loss_weight: 0.5
    entropy_bonus_weight: 0.005
    max_grad_norm: 0.5
    target_kl: 0.02
    hard_checker_rejection_penalty: 1.0
  pi_d_ppo:
    rollout_steps_per_environment: 16
    epochs_per_update: 4
    minibatch_size: 256
    learning_rate: 0.0001
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.20
    value_loss_weight: 0.5
    entropy_bonus_weight: 0.01
    max_grad_norm: 0.5
    target_kl: 0.02
    hard_checker_rejection_penalty: 1.0
  joint_ppo:
    rollout_steps_per_environment: 256
    epochs_per_update: 4
    minibatch_size: 4096
    learning_rate: 0.00005
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.20
    value_loss_weight: 0.5
    entropy_bonus_weight: 0.001
    max_grad_norm: 0.5
    target_kl: 0.01
    hard_checker_rejection_penalty: 1.0

production_runtime:
  seed: 9009
  device: cuda:0
  artifact_root: artifacts/p4_full/order9
  selected_environment_count: 1024
  runtime_load_sample_interval_s: 1.0
  runtime_benchmark_report_path: artifacts/p4_full/order9/c3_runtime_benchmark/runtime_benchmark.json
  runtime_benchmark_report_sha256: 1d0592c4d623a6fd70efb537b1b4f87e3c9a95713cd0abde88d8299d28ed1bef
  checkpoint_interval_updates: 10
  metrics_flush_interval_updates: 1
  full_mesh_evaluation_interval_updates: 25
  full_mesh_evaluation_episode_count: 8
  canonical_order8_report_path: artifacts/p4_full/order8_natural_contact/order8_mu4p5_dt20ms_full_v406.json
  canonical_order8_report_sha256: d0f75cca2ae540c79971766ab722d4530dd4fb44842276256bac40aafdb8cc49
  robot_model_config_path: configs/robot/robot_model.yaml
  tensorized_rollout_hot_path: true
  raw_contact_actor_input: false
  full_mesh_acceptance_replaced: false
  c3_phase_reset_progress_fractions: [0.16666666666666666, 0.5, 0.6666666666666666, 0.9]
  c3_boundary_tail_phase_labels: [place, release, retreat]
  c3_boundary_tail_progress_fraction: 0.9
  c3_contact_reset_preload_steps: 13
  c3_contact_reset_min_selected_contacts: 2
  c3_contact_reset_max_object_displacement_m: 0.03
  c3_contact_reset_max_downward_speed_mps: 0.25
  # The 2 mm value is a lower bound, not a morphology-independent target.
  # At plan installation a common actuator/leverage/contact-compliance model
  # raises it only as far as required by the reviewed contact geometry and
  # estimated object load.  No module-count or bucket-specific switch is used.
  c3_virtual_contact_inward_lead_m: 0.002
  c3_actuator_aware_nominal_preload_enabled: true
  # Global safety cap.  The resolver still selects the smallest quantified
  # physical requirement and collision-clamps it; this cap only accommodates
  # the 41.4 mm train-calibrated request of the most compliant reviewed bucket.
  c3_actuator_aware_nominal_preload_maximum_m: 0.050
  c3_actuator_aware_nominal_preload_quantization_m: 0.001
  c3_actuator_aware_nominal_preload_support_safety_factor: 1.25
  c3_actuator_aware_nominal_preload_maximum_peak_utilization: 0.80
  c3_actuator_aware_nominal_preload_minimum_anchor_fraction: 0.50
  # The deterministic nominal contains only the quantified quasi-static
  # requirement.  Articulated/contact-model error is handled by the bounded
  # learned contact-normal residual instead of a fixed additive lead.
  c3_actuator_aware_nominal_preload_model_error_margin_m: 0.0
  # The nominal 2 mm target remains the neutral command.  During
  # attach/maintain one existing pi_L joint-position coordinate controls a
  # signed local-IK displacement over a 20 mm span, allowing each morphology
  # to learn its own compression without raw contact-force input.
  c3_contact_compression_action_adapter_enabled: true
  c3_contact_compression_action_span_m: 0.020
  # The first common arbitrary-morphology C3 contract uses the same
  # morphology-conditioned coordinated-compression scalar for every module
  # count.  No module-count-dependent global/joint action mode is permitted in
  # this lineage.  CoM/global residuals are introduced only after this common
  # contract passes C3 promotion.
  c3_contact_compression_only_module_counts: [2, 3, 4, 5, 6, 7, 8]
  c3_joint_only_module_counts: []
  # Deployable contact evidence: current link Jacobian and motor-current-
  # equivalent joint torque estimate anchor normal force.  Raw PhysX contact
  # remains reward/evaluation-only.  The support factor is exactly 1.0 for the
  # first C3 validation, adding no unrequested force margin above m*g/(mu*N).
  c3_force_estimator_baseline_update_alpha: 0.10
  c3_force_estimator_filter_alpha: 0.25
  c3_force_estimator_ridge_damping_m2: 0.00001
  c3_force_estimator_minimum_jacobian_norm_m: 0.001
  c3_force_estimator_fit_residual_scale_nm: 0.25
  c3_force_estimator_minimum_confidence: 0.25
  c3_force_estimator_support_safety_factor: 1.0
  # Outcome-only C3 keeps wrench-box membership as diagnostic telemetry only.
  # Keep the diagnostic range exact in training, evaluation, and deployment;
  # it is neither a phase-admission gate nor a pi_L learning objective.
  c3_wrench_gate_curriculum_start_update_index: 0
  c3_wrench_gate_curriculum_scales: [1.0]
  c3_topology_stratified_updates: true
  c3_topologies_per_module_count_per_update: 2
  c3_topology_shard_parallel_process_count: 2
  # Common transition-targeted backward curriculum for morphology expansion.
  # Every module-count stratum receives the same two topology-complete shards.
  # Each shard starts from the persisted 90% state of contact acquisition or
  # lift and runs for 5.12 s, preserving physical and recurrent state across
  # the real boundary.  This removes the phase-reset/continuous-evaluation gap
  # without changing policy, action, reward, QPID, or formal validation.
  c3_state_inheritance_rollouts_enabled: true
  c3_state_inheritance_rollout_steps: 256
  c3_state_inheritance_environment_count_per_module: 48
  c3_state_inheritance_topologies_per_module_count: 2
  c3_state_inheritance_focus_module_counts: []
  c3_state_inheritance_focus_topology_count: 2
  c3_state_inheritance_initial_phase_indices: [1, 2]
  c3_state_inheritance_fixed_reset_progress_fraction: 0.9

