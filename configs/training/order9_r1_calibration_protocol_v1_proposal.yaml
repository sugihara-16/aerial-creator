protocol_version: order9_r1_calibration_protocol_v1
calibration_gate_id: r1-calibration-gate-v1
status: proposed
approval_record: null
stage_id: r1_teacher_trajectory_collection
distribution_id: reachable_pose_expansion

source_c3_release_id: c3_pi_l_promoted_update18_v1
source_c3_checkpoint_sha256: 6ea412ccdfe983cb2b030b3514bc8982424522673b49def188d547120984357b
source_c3_promotion_manifest_sha256: 366ff7eeb32885db296d8ffbfc0aa61826ecbf93ef3404adc69f05baf33eb923
curriculum_schedule_hash: 47e7fb64303333c5207192382dfbb7c85c497d96c6df7e4070988534667f81bd
physical_model_hash: 23dfd5a15d170b356e00a188f952afe98b5646b728a245493c36de36f789591a
source_bucket_manifest:
  artifact_kind: c3_accepted_bucket_manifest
  path: artifacts/p4_full/order9/releases/c3_pi_l_promoted_update18_v1/runtime/rollout_buckets_current_lineage_v5/manifest_c3_release_smooth_clear300_current_config_min2_preload_screened_v2.json
  sha256: ee0001c7c7bc9f5d71ad08219ae73907b5ef4022f82fd90505e3c4642ba291a6
source_bucket_count: 36
source_module_counts: [2, 3, 4, 5, 6, 7, 8]

# Tune the ladder only on the 22 C3 train-owned buckets, then confirm the
# selected envelope once on the untouched 14 validation-owned buckets. A
# confirmation failure rejects this protocol result; it must not trigger
# step-back tuning against validation evidence.
selection_split: train
selection_bucket_count: 22
confirmation_split: validation
confirmation_bucket_count: 14
confirmation_failure_invalidates_protocol: true

# Only object start/goal placement changes. Geometry, properties, support height,
# relative 0.2 m transport, morphology, controller, and C3 pi_L remain unchanged.
coordinate_frame: world
envelope_center: base_task_object_pose_world
sampling_method: independent_uniform_v1
support_geometry_preserved: true
support_pose_preserved: true
robot_reset_preserved: true
calibration_seed: 19009
case_enumeration: level_split_bucket_sample_replay_lexicographic_v1
random_interior_seed_derivation: r1_derived_seed_v1

# C3 already covers +/-5 mm and +/-2 degrees. Each level is a complete symmetric
# residual envelope around each source bucket's own base object pose, evaluated
# in order on the selection split. Therefore its outer shared-nominal extent
# may combine with that bucket's C3 offset. The
# complete 3x3x3 lattice contains center, six face centers, twelve edge
# centers, and eight corners. Only the largest consecutive selection pass is
# confirmation-tested.
calibration_levels:
  - level_id: r1_l1_10mm_5deg
    position_half_span_m: 0.010
    yaw_half_span_rad: 0.08726646259971647
  - level_id: r1_l2_20mm_10deg
    position_half_span_m: 0.020
    yaw_half_span_rad: 0.17453292519943295
  - level_id: r1_l3_30mm_15deg
    position_half_span_m: 0.030
    yaw_half_span_rad: 0.2617993877991494
  - level_id: r1_l4_40mm_20deg
    position_half_span_m: 0.040
    yaw_half_span_rad: 0.3490658503988659

lattice_point_count_per_bucket: 27
random_interior_samples_per_bucket: 4

# Every newly generated teacher+IK path is screened before any controller or
# Isaac replay. The screen only scans the already-resolved dense approach and
# contact-acquisition path, its recorded CPU collision evidence, joint limits,
# rate margins, continuity, and final two-contact grasp pose. It must not rerun
# IK, search/optimize a trajectory, invoke C3 pi_L/QPID/local servo, or start
# Isaac. A path that fails this screen is ineligible for full-layer replay.
fast_screen_version: order9_r1_exact_tracking_fast_screen_v1
fast_screen_execution_model: resolved_pi_h_ik_exact_tracking_to_grasp_pose_v1
fast_screen_phases: [approach, contact_acquisition]
fast_screen_reuses_resolved_trajectory: true
fast_screen_isaac_forbidden: true
fast_screen_controller_layers_forbidden: true
fast_screen_ik_resolve_forbidden: true
fast_screen_trajectory_optimization_forbidden: true
fast_screen_applies_to_calibration_and_collection: true
full_control_test_requires_fast_screen_pass: true
minimum_normalized_joint_limit_reserve: 0.01
maximum_body_tilt_rad: 1.0471975511965976  # 60 degrees

isaac_replays_per_lattice_case: 2
isaac_replays_per_interior_case: 2

# The complete lattice is invariant. Aggregate and random-interior 95% gates
# match R1 collection while preserving deterministic C_H, support, and safety.
minimum_lattice_pass_rate: 1.0
minimum_teacher_feasibility_rate: 0.95
minimum_fast_screen_pass_rate: 0.95
minimum_isaac_success_rate: 0.95
minimum_interior_teacher_feasibility_rate: 0.95
minimum_interior_fast_screen_pass_rate: 0.95
minimum_interior_isaac_success_rate: 0.95
minimum_support_projected_com_margin_m: 0.0
maximum_safety_failure_count: 0
maximum_fallback_rate: 0.0
stop_on_first_failed_level: true
accept_largest_consecutive_passing_level: true
extrapolation_beyond_ladder_forbidden: true
calibration_records_training_eligible: false

# After a calibrated envelope is separately accepted, collect 20 episodes per
# module count: 14 train, 3 validation, and 3 held-out pose seeds. Calibration
# and collection seeds are disjoint. Topology ownership from C3 is preserved;
# held-out here means held-out pose seeds, not an unapproved new topology family.
collection_episode_count: 140
collection_train_episode_count: 98
collection_validation_episode_count: 21
collection_held_out_episode_count: 21
collection_per_module_episode_count: 20
collection_train_per_module_episode_count: 14
collection_validation_per_module_episode_count: 3
collection_held_out_per_module_episode_count: 3
collection_seed_start: 29009
collection_seed_derivation: sequential_seed_start_plus_episode_index_v1
collection_minimum_success_rate: 0.95
collection_minimum_split_module_success_rate: 0.95
collection_maximum_safety_failure_count: 0
collection_maximum_fallback_rate: 0.0
collection_task_id_uniqueness_required: true
collection_seed_uniqueness_required: true
collection_pose_hash_uniqueness_required: true
collection_cross_split_pose_disjoint_required: true
collection_split_module_gate_required: true

minimum_free_gib: 128.0
output_root: artifacts/p4_full/order9/r1_teacher/calibration_v1
